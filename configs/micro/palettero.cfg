# palettero.cfg — Goblin custom commands for micro
# Each line = a command shown in Ctrl+P palette

# ── Goblin Navigation ───────────────────────────────────────
open ~/.config/micro/goblin-help.md              # Goblin keybinds help
open ~/.config/micro/settings.json                # Edit micro settings
open ~/.config/micro/bindings.json                # Edit keybindings
open ~/.config/micro/init.lua                     # Edit init.lua
open ~/.config/micro/colorschemes/darcula-goblin.micro  # Edit colorscheme

# ── Quick Toggles ───────────────────────────────────────────
set ruler false                                   # Hide line numbers
set ruler true                                    # Show line numbers
set softwrap true                                 # Soft wrap on
set softwrap false                                # Soft wrap off
set cursorline false                              # Hide cursor line
set linter false                                  # Disable linter
set linter true                                   # Enable linter

# ── Colorscheme Switcher ────────────────────────────────────
set colorscheme darcula-goblin                    # Switch to Goblin (solid bg)
set colorscheme darcula-glass                     # Switch to Glass (transparent)

# ── File Management ─────────────────────────────────────────
save                                              # Save current file
saveall                                           # Save all open files
reload                                            # Reload from disk
reopen                                            # Reopen current file
cd ~/civil/goblin-vault                           # Go to project root

# ── Editor Actions ──────────────────────────────────────────
tabmove 1                                         # Move tab to first
tabmove -1                                        # Move tab to last
hsplit                                            # Horizontal split
vsplit                                            # Vertical split
term                                              # Open terminal tab
