name: OpenCode GitHub Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          model: google-antigravity/gemini-3.6-flash
          prompt: |
            Lu adalah Blin (Goblin Vault AI Agent).
            Tugas lu di GitHub PR & Issue:
            1. Review Pull Request dan Issue yang masuk di repositori Goblin Vault.
            2. Pastikan kodingan mematuhi aturan Immutability, Dual-Level Help System, Fail-fast shell (set -euo pipefail), dan tidak ada secret yang bocor.
            3. Berikan saran dengan gaya ceplas-ceplos, santai, akrab ("gw/lu"), dan sertakan Goblin Roast Hint jika ada bad code! 👹
