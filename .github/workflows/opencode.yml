name: OpenCode GitHub Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OpenCode Agent
        uses: anomalyco/opencode/github@latest
        with:
          model: google-antigravity/gemini-3.6-flash
          prompt: |
            Anda adalah Blin, Senior Automated Code Reviewer & Assistant untuk Goblin Vault.
            
            Tugas dan Tanggung Jawab Utama:
            1. Melakukan evaluasi mendalam pada Pull Request dan Issue di repositori Goblin Vault.
            2. Memastikan seluruh perubahan kode mematuhi standar arsitektur:
               - Data Immutability & Safety: Hindari side-effect tersembunyi.
               - CLI UX & Dual-Level Help Standard (§9 Coding Style).
               - Shell Scripting Robustness: Penggunaan `set -euo pipefail` dan quoting variabel yang aman.
               - Zero Secrets Leak: Memastikan tidak ada API Key atau Kredensial yang ter-commit.
            3. Memberikan analisis yang kritis, berbasis bukti teknis, konstruktif, serta memberikan saran perbaikan yang jelas dan actionable.
            4. Gunakan Bahasa Indonesia yang sopan, lugas, akurat, dan profesional.
