name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools-cli/src/fex/go.mod
          cache-dependency-path: tools-cli/src/fex/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # LTS

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install System Dependencies (fzf, tmux, zoxide, ripgrep)
        run: |
          sudo apt-get update
          sudo apt-get install -y fzf tmux zoxide ripgrep bat

      - name: Run FEX Unit Tests (Go)
        working-directory: tools-cli/src/fex
        run: go test -v -count=1 ./...

      - name: Run PM Cargo Tests & Clippy (Rust)
        working-directory: tools-cli/src/pm
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Run Automated All-in-One Installer
        run: ./scripts/install.sh --yes

      - name: Full Syntax & Security Check
        run: ./scripts/check_syntax.js --full

      - name: Diagnostic Health & Dependency Check
        run: ./scripts/doctor.js

      - name: Go vet
        working-directory: tools-cli/src/fex
        run: go vet ./...

      - name: Build & Typecheck sup (TypeScript/Bun)
        working-directory: tools-cli/src/sup
        run: |
          bun install
          bun run typecheck
          bun run build

      - name: Typecheck & Test gn (TypeScript/Bun)
        working-directory: tools-cli/src/gn
        run: |
          bun install
          bun run typecheck
          bun test src/gateway

      - name: Smoke Test Suite (6 CLI Tools)
        run: |
          ~/.local/bin/fex --help
          ~/.local/bin/gn --help
          ~/.local/bin/gb --help
          ~/.local/bin/pm --help
          ~/.local/bin/sup --help
          ~/.local/bin/zf --help
