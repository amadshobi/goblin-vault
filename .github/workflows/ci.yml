name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools-cli/src/fex/go.mod
          cache-dependency-path: tools-cli/src/fex/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"   # LTS

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install System Dependencies (fzf & tmux)
        run: |
          sudo apt-get update
          sudo apt-get install -y fzf tmux

      - name: Add tools-cli/bin to PATH
        run: echo "$GITHUB_WORKSPACE/tools-cli/bin" >> $GITHUB_PATH

      - name: Install tool dependencies (gn, gb & sup)
        run: |
          cd tools-cli/src/gn && bun install
          cd ../gb && bun install
          cd ../sup && bun install

      - name: Shell & JS syntax check
        run: ./scripts/check_syntax.js --full

      - name: Build fex (Go) & Install to PATH
        working-directory: tools-cli/src/fex
        run: |
          go build -o $GITHUB_WORKSPACE/tools-cli/bin/fex ./cmd/fex
          mkdir -p ~/.local/bin
          cp $GITHUB_WORKSPACE/tools-cli/bin/fex ~/.local/bin/fex

      - name: Health & dependency check
        run: ./scripts/doctor.js

      - name: Go vet
        working-directory: tools-cli/src/fex
        run: go vet ./...

      - name: Smoke test fex
        run: fex --help

      - name: Build & Typecheck sup (TypeScript/Bun)
        working-directory: tools-cli/src/sup
        run: |
          bun install
          bun run typecheck
          bun run build
