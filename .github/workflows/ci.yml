name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tools-cli/src/fex/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Shell & JS syntax check
        run: bash scripts/check_syntax.sh

      - name: Health & dependency check
        run: bash scripts/doctor.sh

      - name: Build fex (Go)
        working-directory: tools-cli/src/fex
        run: go build -o /tmp/fex .

      - name: Smoke test fex
        run: /tmp/fex --help || true
